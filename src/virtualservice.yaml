apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: kinspect-api
spec:
  hosts:
    - "kinspect.api.local"  # This should match the host in the Gateway
  gateways:
    - kinspect-gateway  # Reference to the Gateway
  http:
    - match:
        - uri:
            prefix: /  # Match all paths
      route:
        - destination:
            host: kinspect-api.kinspect-dev.svc.cluster.local  # Your Kubernetes service name
            port:
              number: 8080  # Expose container on port 8080
