apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kinspect-api
  labels:
    app: kinspect-api
spec:
  replicas: 10
  selector:
    matchLabels:
      app: kinspect-api
  template:
    metadata:
      labels:
        app: kinspect-api
    spec:
      containers:
        - name: kinspect-api
          image: vmyronovych/kinspect-api:2b1aa48
          ports:
            - containerPort: 8080
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause:
            duration: 30s
        - setWeight: 25
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 100
