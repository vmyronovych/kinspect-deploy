apiVersion: v1
kind: Service
metadata:
  name: kinspect-api
  labels:
    app: kinspect-api
spec:
  selector:
    app: kinspect-api
  ports:
    - name: http-app
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: http-envoy-prom
      protocol: TCP
      port: 15090
      targetPort: 15090
