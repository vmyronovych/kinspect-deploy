# Gateway definition
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: argocd-gateway
  namespace: istio-system  # Modify if your Istio system is in a different namespace
spec:
  selector:
    istio: ingressgateway  # Selects the Istio ingress gateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "argocd.local"  # The hostname for the service

---
# VirtualService definition
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: argocd-server
  namespace: argocd
spec:
  hosts:
  - "argocd.local"  # The hostname for the service
  gateways:
  - istio-system/argocd-gateway  # Reference to the Gateway created earlier
  http:
  - match:
    - uri:
        prefix: "/"  # Matches all incoming requests
    route:
    - destination:
        host: argocd-server.argocd.svc.cluster.local  # Service name and namespace
        port:
          number: 80  # Use port 80 for HTTP
