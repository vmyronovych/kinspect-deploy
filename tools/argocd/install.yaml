apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: argocd-gateway
spec:
  selector:
    istio: ingressgateway  # This selects Istio's ingress gateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        credentialName: argocd-cert-secret  # The secret containing the certificate
        mode: SIMPLE
        privateKey: sds
        serverCertificate: sds
      hosts:
        - "argocd.local"  # Replace with your domain

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: argocd-virtualservice
spec:
  hosts:
    - "argocd.local"  # Replace with your domain
  gateways:
    - argocd-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: argocd-server.argocd.svc.cluster.local  # Replace with the ArgoCD server's DNS name
            port:
              number: 8080

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-cert
spec:
  secretName: argocd-cert-secret
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
  commonName: argocd.local  # Replace with your domain
  dnsNames:
    - argocd.local
  duration: 8760h # 1 year
  renewBefore: 360h # 15 days before expiry

