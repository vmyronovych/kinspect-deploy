apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: argocd-gateway
spec:
  selector:
    istio: ingressgateway  # Use the Istio ingress gateway
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: argocd-ingress-tls  # Reference the secret created earlier
      minProtocolVersion: TLSV1_2
    hosts:
    - "argocd.local"  # The host for the ArgoCD UI

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: argocd
spec:
  hosts:
  - "argocd.local"  # The same host as the Gateway
  gateways:
  - argocd-gateway  # Reference the Gateway created earlier
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: argocd-server.argocd.svc.cluster.local  # The internal ArgoCD service
        port:
          number: 8080
