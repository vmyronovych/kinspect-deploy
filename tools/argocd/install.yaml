apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: argocd-server-gateway
spec:
  selector:
    istio: ingressgateway  # Use Istio's default ingress gateway
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "argocd.local"  # Exposing HTTPS traffic
    tls:
      mode: PASSTHROUGH  # This tells Istio to pass-through traffic securely to the pod (without termination)
      # credentialName: argocd-secret  # You can leave this out if you don't have certificates
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: argocd-server
spec:
  hosts:
  - "argocd.local"  # Traffic routed for this host
  gateways:
  - argocd-server-gateway
  http:
  - match:
    - uri:
        prefix: /  # All traffic goes to the argocd-server
    route:
    - destination:
        host: argocd-server.argocd.svc.cluster.local
        port:
          number: 443  # Port 443 for HTTPS traffic (your pods listen on HTTPS)
