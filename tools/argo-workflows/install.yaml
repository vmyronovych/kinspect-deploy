apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: argo-workflows-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "argo-workflows.local"

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: argo-workflows
spec:
  hosts:
  - "argo-workflows.local"
  gateways:
  - argo-workflows-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: argo-server.argo.svc.cluster.local
        port:
          number: 2746
