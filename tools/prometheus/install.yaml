---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: prometheus-gateway
  namespace: observability
spec:
  selector:
    istio: ingressgateway # Use Istio's default ingress gateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "prometheus.local"

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: prometheus-virtualservice
  namespace: observability
spec:
  hosts:
  - "prometheus.local" # Host that matches the Gateway
  gateways:
  - prometheus-gateway # Gateway created above
  http:
  - match:
    - uri:
        prefix: / # Optional: You can restrict path here
    route:
    - destination:
        host: prometheus-operated.observability.svc.cluster.local
        port:
          number: 9090 # This is the port exposed by the service
