---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: grafana-gateway
spec:
  selector:
    istio: ingressgateway # Use Istio's default ingress gateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "grafana.local" # Host to match for requests
    # If you want to enable TLS, replace the following block
    # tls:
    #   mode: SIMPLE
    #   credentialName: grafana-tls-secret # Replace with your secret name
    #   privateKey: sds
    #   serverCertificate: sds

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: grafana-virtualservice
spec:
  hosts:
  - "grafana.local" # Host that matches the Gateway
  gateways:
  - grafana-gateway # Gateway created above
  http:
  - match:
    - uri:
        prefix: / # Optional: You can restrict path here
    route:
    - destination:
        host: kube-prom-stack-grafana.observability.svc.cluster.local
        port:
          number: 80 # This is the port exposed by the service

---
# Optional: If enabling TLS, create a Kubernetes secret for your TLS certificates
