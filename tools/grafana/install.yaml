---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: grafana-gateway
  namespace: observability
spec:
  selector:
    istio: ingressgateway # Use Istio's default ingress gateway
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "grafana.local" # Host to match for requests
    tls:
      mode: PASSTHROUGH # Use PASSTHROUGH to let Istio handle TLS termination
      # Istio will auto-manage the certs in PASSTHROUGH mode and terminate the TLS connection

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: grafana-virtualservice
  namespace: observability
spec:
  hosts:
  - "grafana.local" # Host that matches the Gateway
  gateways:
  - grafana-gateway # Gateway created above
  http:
  - match:
    - uri:
        prefix: / # Optional: You can restrict path here
    route:
    - destination:
        host: kube-prom-stack-grafana.observability.svc.cluster.local
        port:
          number: 80 # This is the port exposed by the service
