---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: grafana-gateway
  namespace: observability
spec:
  selector:
    istio: ingressgateway # Use Istio's default ingress gateway
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "grafana.local" # Host to match for requests
    tls:
      mode: SIMPLE
      credentialName: "" # Leave empty to use Istio's auto-provisioned certs
      # Istio will use the default certificate for HTTPS termination
      minProtocolVersion: TLSV1_2

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: grafana-virtualservice
  namespace: observability
spec:
  hosts:
  - "grafana.local" # Host that matches the Gateway
  gateways:
  - grafana-gateway # Gateway created above
  http:
  - match:
    - uri:
        prefix: / # Optional: You can restrict path here
    route:
    - destination:
        host: kube-prom-stack-grafana.observability.svc.cluster.local
        port:
          number: 80 # This is the port exposed by the service

---
# Optional: If using Istio's default TLS certs, no need to create a secret.
# If you want to provide a custom certificate, you can specify it using a `credentialName`.
